# ==============================================================================
# Editor Typography & Layout Configuration (scientific & ergonomic standard)
# ==============================================================================

[font]
# Primary monospace font with clear distinction between 0/O and 1/l/I
family = "JetBrains Mono"
fallback_family = "Fira Code"

# Ergonomic visual target: 13–14pt on standard pixel density (96 DPI), 
# or 14–15pt on high-density displays (e.g., Retina / 4K) to minimize eyestrain.
size = 13.0

# Line height (1.4 - 1.5) provides optimal vertical rhythm and visual comfort
line_height = 1.45

# Letter spacing (0.05 - 0.1em) prevents characters from touching on low-DPI displays
letter_spacing = 0.0

# Font weight settings (Regular for body code, Bold for highlights)
weight = "regular"
bold_weight = "bold"

[ligatures]
# Enable contextual programming ligatures (==, !=, =>, ->, <=, >=)
# Reduces cognitive load by treating visual operators as single glyphs
enabled = true

# Font features (verified present in the installed JetBrains Mono v2.211)
# zero: alternative zero glyph (prevents '0' vs 'O' confusion)
# NOTE: this font build has NO ss01/ss02/cv16/cv20 (those belong to other distributions)
font_features = ["zero"]

[indentation]
# Indentation strategy (spaces over hard tabs per PEP 8, Google, and POSIX standards)
use_spaces = true
tab_width = 4
shift_width = 4
soft_tab_stop = 4

[rulers]
# Visual margin indicators (80 chars for standard readability, 120 chars max soft limit)
# Research shows line lengths between 60-80 characters optimize reading speed and focus.
column_rulers = [80, 120]

[whitespace]
# Render subtle indicators for whitespace to avoid invisible formatting errors
render_tabs = true
render_spaces = false
render_trailing_spaces = true
render_newline = false

[cursor]
# Smooth blinking block cursor reduces visual tracking effort during active editing
shape = "block"          # "block" | "line" | "underline"
blink = true
blink_rate_ms = 500
