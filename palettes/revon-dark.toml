[meta]
name = "Revon Dark"
variant = "dark"
author = "mipecx"

[base]
# Base background and foreground tones (darkest to lightest)
bg_dark     = "#111317" # Panels, statuslines, inactive window backgrounds
bg_main     = "#16181d" # Main editor and terminal background
bg_surface  = "#21252d" # Line highlighting, floating window backgrounds
bg_highlight= "#2d333f" # Visual selection, active tabs

fg_muted    = "#636e82" # Comments, icons, line numbers (APCA Lc 25; WCAG 3.45 — below AA)
fg_subtle   = "#9da8bd" # Inactive elements, punctuation
fg_main     = "#e1e4ea" # Primary text and code (APCA Lc 89)
fg_bright   = "#ffffff" # Bright text, bold accents

[accents]
# Accent colors tuned in Oklab (L 0.68–0.78 — not equal-luminance)
red         = "#ea696c" # Errors, diff deletion
orange      = "#e88d67" # Constants, numbers, operators
yellow      = "#dcb15d" # Data types, warnings, classes
green       = "#7ec18c" # Strings, diff addition
cyan        = "#5ebfbe" # Regular expressions, special characters
blue        = "#6ca3f0" # Functions, methods, key identifiers
purple      = "#b388eb" # Control flow keywords (return, if, yield)
magenta     = "#e070b4" # Properties, parameters, special variables

[ui]
border      = "#2d333f"
selection   = "#343d4f"
cursor      = "#6ca3f0"
links       = "#5ebfbe"
