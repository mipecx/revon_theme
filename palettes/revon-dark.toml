[meta]
name = "Revon Dark"
variant = "dark"
author = "mipecx"

[base]
# Base background and foreground tones (darkest to lightest)
bg_dark     = "#111317" # Panels, statuslines, inactive window backgrounds
bg_main     = "#16181d" # Main editor and terminal background
bg_surface  = "#21252d" # Line highlighting, floating window backgrounds
bg_highlight= "#2d333f" # Visual selection, active tabs

fg_muted    = "#636e82" # Comments, icons, line numbers (APCA Lc 25; WCAG 3.45 — below AA)
fg_subtle   = "#9da8bd" # Inactive elements, punctuation
fg_main     = "#e1e4ea" # Primary text and code (APCA Lc 89)
fg_bright   = "#ffffff" # Bright text, bold accents

[accents]
# Accent colors in Oklab; chroma boosted x1.3 for perceptual separation
# (min Oklab dE between syntax colors: 10.8 -> 13.7)
red         = "#fe515d" # Errors, diff deletion
orange      = "#f9824e" # Constants, numbers, operators
yellow      = "#e6ae2e" # Data types, warnings, classes
green       = "#6bc681" # Strings, diff addition
cyan        = "#2dc4c3" # Regular expressions, special characters
blue        = "#5fa2ff" # Functions, methods, key identifiers
purple      = "#b97eff" # Control flow keywords (return, if, yield)
magenta     = "#f15cbb" # Properties, parameters, special variables

[ui]
border      = "#2d333f"
selection   = "#343d4f"
cursor      = "#5fa2ff"
links       = "#2dc4c3"
